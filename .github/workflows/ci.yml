name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  jest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clean-architecture-visualizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer

      - name: Run jest
        run: npm test

  backend-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clean-architecture-visualizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer

      - name: Run type check
        run: npm run type-check

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer/frontend

      - name: Run type check
        run: npm run type-check
        working-directory: ./clean-architecture-visualizer/frontend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./clean-architecture-visualizer/frontend

  biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: ./.github/actions/setup-node-env

      - name: Run Biome
        run: npm run check:ci -- --reporter=github
