name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  jest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clean-architecture-visualizer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer

      - name: Run jest
        run: npm test

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The extension build bundles the engine from source, so it needs the
      # engine's dependencies too.
      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./vscode-extension

      - name: Type check
        run: npm run typecheck
        working-directory: ./vscode-extension

      - name: Unit tests
        run: npm test
        working-directory: ./vscode-extension

      - name: Package .vsix
        run: npm run package
        working-directory: ./vscode-extension

      # Download from the run's Summary page to try a PR's build in VSCode.
      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: cave-vscode-vsix
          path: vscode-extension/*.vsix

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer/frontend

      - name: Run type check
        run: npm run type-check
        working-directory: ./clean-architecture-visualizer/frontend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ./clean-architecture-visualizer/frontend

  biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: ./.github/actions/setup-node-env

      - name: Run Biome
        run: npm run check:ci -- --reporter=github
