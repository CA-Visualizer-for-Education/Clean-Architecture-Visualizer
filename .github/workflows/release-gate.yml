name: release-gate

on:
  push:
    # auto trigger when a new cave version is released
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show workspace after checkout
        run: ls -la

      - uses: ./.github/actions/setup-node-env
        with:
          working-directory: ./clean-architecture-visualizer

      - name: Build the CLI and frontend
        run: npm run build
        working-directory: ./clean-architecture-visualizer

      - name: pack then install package
        run: npm pack && npm install -g ./*.tgz
        working-directory: ./clean-architecture-visualizer

      - name: check cave version
        run: cave --version

      - name: checkout samples
        uses: actions/checkout@v4
        with:
          repository: hiuyear/cave-test-repo
          path: cave-test-repo
          ref: c21626857b2d8ccdf64ef09436aada6e5e5995dd
      
      - name: Show workspace after checking out test repo
        run: ls -la
        working-directory: cave-test-repo

      # for bad sample
      - name: Assert violation-bad-import reports the entities to controller edge
        working-directory: cave-test-repo/violation-bad-import
        run: |
          out=$(cave verify)
          echo "$out"

          if ! grep -q 'EnrollStudent' <<< "$out"; then
            echo "expect cave verify to report the use case EnrollStudent, but it didn't appear. cave probably didn't find a project here."
            exit 1
          fi

          if ! grep -E -q '[[:space:]]+entities.*controller' <<< "$out"; then
            echo "expect a violation line with entities -> controller. entity/Student.java
            imports and calls EnrollStudentController, so cave must flag it, but did not"
            exit 1
          fi

          echo "contract holds: cave detected the illegal entities -> controller dependency"

      - name: Assert violation-static-import reports the entities to presenter edge
        working-directory: cave-test-repo/violation-static-import
        run: |
          out=$(cave verify)
          echo "$out"

          if ! grep -q 'EnrollStudent' <<< "$out"; then
            echo "expect cave verify to report the use case EnrollStudent, but it didn't appear. cave probably didn't find a project here."
            exit 1
          fi

          if ! grep -E -q '[[:space:]]+entities.*presenter' <<< "$out"; then
            echo "expect a violation line with entities -> presenter. entity/Student.java
            statically imports EnrollStudentPresenter.formatStudentName and calls it without
            a class qualifier, so cave must resolve the method to its declaring Presenter."
            exit 1
          fi

          echo "contract holds: cave detected the illegal entities -> presenter dependency"

      - name: Assert violation-qualified-reference reports the outputData to viewModel edge
        working-directory: cave-test-repo/violation-qualified-reference
        run: |
          out=$(cave verify)
          echo "$out"

          if ! grep -q 'EnrollStudent' <<< "$out"; then
            echo "expect cave verify to report the use case EnrollStudent, but it didn't appear. cave probably didn't find a project here."
            exit 1
          fi

          if ! grep -E -q '[[:space:]]+outputData.*viewModel' <<< "$out"; then
            echo "expect a violation line with outputData -> viewModel. EnrollStudentOutputData.toViewModel()
            constructs and returns interface_adapter.EnrollStudent.EnrollStudentViewModel
            using fully qualified names without an import, so cave must flag it."
            exit 1
          fi

          echo "contract holds: cave detected the illegal outputData -> viewModel dependency"

      # for good sample
      - name: Assert clean-standard omits the entities to controller edge
        working-directory: cave-test-repo/clean-standard
        run: |
          out=$(cave verify)
          echo "$out"

          if ! grep -q 'EnrollStudent' <<< "$out"; then
            echo "expect cave verify to report the use case EnrollStudent, but it didn't appear. cave probably did not find a project here."
            exit 1
          fi

          if grep -E -q '[[:space:]]+entities.*controller' <<< "$out"; then
            echo "did not expect a violation line with entities -> controller. clean-standard
            has no entity depending on a controller, so cave has reported a false positive in dependency detection."
            exit 1
          fi

          echo "contract holds: cave reported no entities -> controller dependency in the legal sample"
